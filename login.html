<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="description"
        content="Log in to your Auction House account."
    />

    <title>Log In | Auction House</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="src/style.css"
    />
</head>

<body>

    <header id="navbar"></header>

    <main>
        <section class="auth-page">
            <div class="container">

                <div class="auth-card">

                    <h1>Log In</h1>

                    <p class="auth-intro">
                        Welcome back to Auction House.
                    </p>

                    <form id="login-form">

                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label"
                            >
                                Student email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="you@stud.noroff.no"
                                required
                                autocomplete="email"
                            />
                        </div>

                        <div class="mb-3">
                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                                autocomplete="current-password"
                            />
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Log in
                        </button>

                    </form>

                    <div
                        id="login-message"
                        class="auth-message"
                        aria-live="polite"
                    ></div>

                    <p class="auth-footer">
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </p>

                </div>

            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
    type="module"
    src="src/js/auth/login.js"
></script>

</body>
</html>

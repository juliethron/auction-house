<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Listing | Auction House</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="src/style.css">

</head>


<body>

    <header id="navbar"></header>


    <main>

        <section class="create-listing-page">

            <div class="create-listing-card">

                <h1>EDIT LISTING</h1>

                <p>
                    Update your auction listing.
                </p>


                <form id="edit-listing-form">

                    <div class="mb-3">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="5"
                        ></textarea>

                    </div>


                    <div class="mb-3">

                        <label for="tags">
                            Tags
                        </label>

                        <input
                            type="text"
                            id="tags"
                            placeholder="e.g. vintage, furniture, collectible"
                        >

                        <small>
                            Separate tags with commas.
                        </small>

                    </div>


                    <div class="mb-3">

                        <label for="image-url">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="image-url"
                        >

                    </div>


                    <div class="mb-4">

                        <label for="image-alt">
                            Image description
                        </label>

                        <input
                            type="text"
                            id="image-alt"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save changes
                    </button>

                </form>


                <p
                    id="edit-listing-message"
                    class="mt-3"
                ></p>

            </div>

        </section>

    </main>

    <div id="footer"></div> 

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script
        type="module"
        src="src/js/listings/updateListing.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create a new auction listing."
    >

    <title>Create Listing | Auction House</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="src/style.css">
</head>


<body>

    <header id="navbar"></header>


    <main>

        <section class="create-listing-page">

            <div class="create-listing-card">

                <h1>CREATE LISTING</h1>

                <p>
                    Put something up for auction.
                </p>


                <form id="create-listing-form">


                    <div class="mb-3">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="What are you selling?"
                            required
                        >

                    </div>



                    <div class="mb-3">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="5"
                            placeholder="Tell people about your item..."
                        ></textarea>

                    </div>



                    <div class="mb-3">

                        <label for="tags">
                            Tags
                        </label>

                        <input
                            type="text"
                            id="tags"
                            placeholder="e.g. gaming, art, collectibles"
                        >

                        <small>
                            Separate tags with commas.
                        </small>

                    </div>



                    <div class="mb-3">

                        <label for="image-url">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="image-url"
                            placeholder="https://example.com/image.jpg"
                        >

                    </div>



                    <div class="mb-3">

                        <label for="image-alt">
                            Image description
                        </label>

                        <input
                            type="text"
                            id="image-alt"
                            placeholder="Describe the image"
                        >

                    </div>



                    <div class="mb-4">

                        <label for="ends-at">
                            Auction ends
                        </label>

                        <input
                            type="datetime-local"
                            id="ends-at"
                            required
                        >

                    </div>



                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create listing
                    </button>

                </form>


                <p
                    id="create-listing-message"
                    class="mt-3"
                ></p>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        type="module"
        src="src/js/listings/createListing.js"
    ></script>

</body>

</html>
